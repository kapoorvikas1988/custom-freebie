# fly.toml app configuration file generated for custom-freebie-blue-glitter-8766 on 2026-04-09T15:03:11+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'custom-freebie-blue-glitter-8766'
primary_region = 'bom'

[build]

[env]
  PORT = '3000'
  SCOPES = 'read_payment_customizations,write_payment_customizations,write_products'
  SHOPIFY_API_KEY = '8fded8bcdc229260a6362b0b7f6618ab'
  SHOPIFY_APP_URL = 'https://custom-freebie-blue-glitter-8766.fly.dev'

[processes]
  app = 'node ./dbsetup.js npm run docker-start'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
